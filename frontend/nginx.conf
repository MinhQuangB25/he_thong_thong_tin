server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html names the current hashed bundles; revalidate it so a new deploy is picked up at once.
  location = /index.html { add_header Cache-Control "no-cache"; }
  # Vite assets carry a content hash in their file name, so they never change in place.
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}
